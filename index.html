<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>個人化資產配置與管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Personal Asset Dashboard</p>
        <h1>個人化資產配置與管理</h1>
      </div>
      <div class="header-meta">
        <span id="sourceStatus">尚未連結資料</span>
        <span id="updatedAt">--</span>
        <div class="header-actions">
          <button type="button" id="privacyToggle" class="icon-action" aria-pressed="false" aria-label="隱藏金額">
            <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 3l18 18" />
              <path d="M10.6 10.7A3 3 0 0 0 12 15a3 3 0 0 0 2.2-5" />
              <path d="M7.5 7.8C4.4 9.5 2.5 12 2.5 12s3.5 6 9.5 6c1.7 0 3.1-.5 4.4-1.2" />
              <path d="M12.6 6C18.1 6.3 21.5 12 21.5 12s-.8 1.4-2.2 2.8" />
            </svg>
          </button>
          <button type="button" id="refreshData" class="header-action">重新整理資料</button>
        </div>
      </div>
    </header>

    <main>
      <nav class="view-tabs" aria-label="Dashboard 分頁">
        <button type="button" class="tab-button is-active" data-view="overview">資產總覽</button>
        <button type="button" class="tab-button" data-view="holdings">目前持股</button>
        <button type="button" class="tab-button" data-view="realizedTw">台股已實現損益</button>
        <button type="button" class="tab-button" data-view="realizedUs">美股已實現損益</button>
      </nav>

      <section class="summary-grid" aria-label="資產摘要">
        <article class="metric">
          <span id="primaryMetricLabel">總資產（台幣）</span>
          <strong id="totalValue">--</strong>
        </article>
        <article class="metric">
          <span id="secondMetricLabel">資產類別</span>
          <strong id="assetClassCount">--</strong>
        </article>
        <article class="metric">
          <span id="thirdMetricLabel">帳戶數</span>
          <strong id="accountCount">--</strong>
        </article>
        <article class="metric">
          <span id="fourthMetricLabel">最大配置</span>
          <strong id="largestClass">--</strong>
        </article>
        <article class="metric extra-metric is-hidden">
          <span id="fifthMetricLabel">今日台股損益</span>
          <strong id="taiwanTodayProfit">--</strong>
        </article>
        <article class="metric extra-metric is-hidden">
          <span id="sixthMetricLabel">今日美股損益</span>
          <strong id="usTodayProfit">--</strong>
        </article>
      </section>

      <section class="dashboard-grid">
        <article class="panel">
          <div class="panel-header">
            <h2 id="allocationTitle">資產配置</h2>
            <span id="allocationTotal">--</span>
          </div>
          <div id="allocationChart" class="donut-wrap"></div>
        </article>

        <article class="panel">
          <div class="panel-header">
            <h2 id="barTitle">帳戶分布</h2>
            <span id="barSubtitle">依目前市值</span>
          </div>
          <div id="accountBars" class="bar-list"></div>
        </article>
      </section>

      <section id="annualNetAssetPanel" class="panel annual-net-assets-panel is-hidden">
        <div class="panel-header">
          <div>
            <p class="panel-eyebrow">Net-worth history</p>
            <h2>年度淨資產變化</h2>
          </div>
          <span>每年最後一筆紀錄</span>
        </div>
        <div id="annualNetAssetChart"></div>
      </section>

      <section id="holdingCardsPanel" class="panel holding-cards-panel is-hidden">
        <div class="panel-header">
          <div>
            <p class="panel-eyebrow">Portfolio desk</p>
            <h2>持股儀表板</h2>
          </div>
          <div class="holding-cards-tools">
            <span id="holdingCardsMeta">依持股權重排序</span>
            <div class="holding-sort-control">
              <label for="holdingSort">排序</label>
              <select id="holdingSort" aria-label="持股儀表板排序依據">
                <option value="weight">持股權重</option>
                <option value="cumulativeProfit">累積獲利</option>
                <option value="dailyProfit">即時損益</option>
                <option value="dividend">股息</option>
              </select>
              <button type="button" id="holdingSortDirection" class="holding-sort-direction" aria-label="改為由低至高排序" title="改為由低至高排序">
                <span aria-hidden="true">↓</span>
              </button>
            </div>
          </div>
        </div>
        <div id="holdingCards" class="holding-cards"></div>
      </section>

      <section class="panel">
        <div class="panel-header table-header">
          <h2 id="detailTitle">資產明細</h2>
          <input id="tableSearch" type="search" placeholder="搜尋資產、帳戶或類別" />
        </div>
        <div class="table-wrap">
          <table>
            <thead id="tableHead"></thead>
            <tbody id="assetRows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <template id="emptyState">
      <tr>
        <td colspan="8" class="empty">
          資料載入中，或先載入範例查看 Dashboard 呈現方式。
        </td>
      </tr>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
